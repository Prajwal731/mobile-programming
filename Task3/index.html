<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
</head>
<body>

    <h2>Simple Calculator</h2>

    <input type="number" id="n1" placeholder="Enter first number" max="100">
    <input type="number" id="n2" placeholder="Enter second number" max="100">

    <br><br>

    <button type="button" onclick="calculate('add')">Add</button>
    <button type="button" onclick="calculate('sub')">Subtract</button>
    <button type="button" onclick="calculate('mul')">Multiply</button>
    <button type="button" onclick="calculate('div')">Divide</button>

    <h3 id="result">Result: </h3>

    <script src="script.js" defer></script>

</body>
</html>
