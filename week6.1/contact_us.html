<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Chaiyo</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body{
  background: linear-gradient(135deg, #a8e6cf, #dcedc1);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:#f6fff9;
  padding:30px;
  width:370px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:#2e7d32;
  letter-spacing:1px;
}

.input-group{
  margin-bottom:15px;
}

input, textarea{
  width:100%;
  padding:12px;
  border:1px solid #c8e6c9;
  border-radius:8px;
  font-size:14px;
  background:#ffffff;
  transition:0.3s;
}

input:focus, textarea:focus{
  border-color:#66bb6a;
  outline:none;
  box-shadow:0 0 6px rgba(102,187,106,0.4);
}

textarea{
  resize:none;
  height:120px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  background:#66bb6a;
  color:#fff;
  font-size:15px;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#388e3c;
}

#message{
  margin-top:15px;
  text-align:center;
  color:#2e7d32;
  font-size:14px;
  font-weight:500;
}
</style>
</head>

<body>

<div class="container">
  <h2>Contact Chaiyo 🌿</h2>

  <form id="contactForm">
    <div class="input-group">
      <input type="text" id="name" placeholder="Your Name" required>
    </div>

    <div class="input-group">
      <input type="email" id="email" placeholder="Your Email" required>
    </div>

    <div class="input-group">
      <textarea id="messageBox" placeholder="Write your message..." required></textarea>
    </div>

    <button type="submit">Send Message</button>
  </form>

  <p id="message"></p>
</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
  e.preventDefault();

  document.getElementById("message").textContent = "Message sent successfully!";

  this.reset();
});
</script>

</body>
</html>
